name: mispisit-vasilev

services:
  app:
    image: nightfuze/mispisit-lab1:0.0.6
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      NODE_ENV: production
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-8000}
      MONGO_HOST: mongo
      MONGO_PORT: ${MONGO_PORT:-27017}
      MONGO_ROOT_USER: ${MONGO_ROOT_USER:-root}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-example}
      DATABASE_NAME: ${DATABASE_NAME:-meteor-platform}
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:9.0.4
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-example}
      MONGO_INITDB_DATABASE: ${DATABASE_NAME:-meteor-platform}
    volumes:
      - mongo_prod_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  backup:
    image: mongo:9.0.4
    profiles: ["tools"]
    user: root
    environment:
      MONGO_ROOT_USER: ${MONGO_ROOT_USER:-root}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-example}
      DATABASE_NAME: ${DATABASE_NAME:-meteor-platform}
    volumes:
      - ./backup:/backup
    command: >
      sh -c 'mongodump --host mongo
      -u "$$MONGO_ROOT_USER" -p "$$MONGO_ROOT_PASSWORD"
      --authenticationDatabase admin
      --db "$$DATABASE_NAME"
      --archive=/backup/app.archive'
    depends_on:
      mongo:
        condition: service_healthy

  restore:
    image: mongo:9.0.4
    profiles: ["tools"]
    user: root
    environment:
      MONGO_ROOT_USER: ${MONGO_ROOT_USER:-root}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-example}
      DATABASE_NAME: ${DATABASE_NAME:-meteor-platform}
    volumes:
      - ./backup:/backup
    command: >
      sh -c 'mongorestore --host mongo
      -u "$$MONGO_ROOT_USER" -p "$$MONGO_ROOT_PASSWORD"
      --authenticationDatabase admin
      --drop
      --archive=/backup/app.archive'
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_prod_data:
